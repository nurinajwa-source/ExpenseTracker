<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app">

    <header class="header">
      <div>
        <p class="tag">Finance Tracker</p>
        <h1>Personal Expense Tracker</h1>
        <p class="subtitle">Track your income, expenses and balance easily.</p>
      </div>

      <button id="themeBtn" class="theme-btn">🌙 Dark Mode</button>
    </header>

    <section class="summary">
      <div class="card balance-card">
        <p>Total Balance</p>
        <h2 id="balance">RM 0.00</h2>
      </div>

      <div class="card income-card">
        <p>Total Income</p>
        <h2 id="income">RM 0.00</h2>
      </div>

      <div class="card expense-card">
        <p>Total Expense</p>
        <h2 id="expense">RM 0.00</h2>
      </div>
    </section>

    <main class="main">

      <section class="panel">
        <h2>Add Transaction</h2>

        <form id="transactionForm">
          <div class="form-group">
            <label for="title">Transaction Name</label>
            <input type="text" id="title" placeholder="Example: Food, Salary, Transport" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (RM)</label>
              <input type="number" id="amount" placeholder="Example: 50" min="1" step="0.01" required />
            </div>

            <div class="form-group">
              <label for="type">Type</label>
              <select id="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="Salary">Salary</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Others">Others</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <button type="submit" class="submit-btn">Add Transaction</button>
        </form>

        <button id="exportBtn" class="export-btn">Export CSV</button>
      </section>

      <section class="panel">
        <h2>Expense Chart</h2>
        <div class="chart-box">
          <canvas id="expenseChart"></canvas>
        </div>
      </section>

    </main>

    <section class="panel transaction-section">
      <div class="transaction-header">
        <h2>Transaction History</h2>
        <button id="clearBtn" class="clear-btn">Clear All</button>
      </div>

      <div id="transactionList" class="transaction-list"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
