<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ExpenseTracker | Fund</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="navbar"></div>

  <section class="page-header">
    <p class="badge">Money Dashboard</p>
    <h1>My Fund Tracker</h1>
    <p>Add your income and expenses here.</p>
  </section>

  <section class="summary">
    <div class="summary-card balance">
      <p>Total Balance</p>
      <h2 id="balance">RM 0.00</h2>
    </div>

    <div class="summary-card income">
      <p>Total Income</p>
      <h2 id="income">RM 0.00</h2>
    </div>

    <div class="summary-card expense">
      <p>Total Expense</p>
      <h2 id="expense">RM 0.00</h2>
    </div>
  </section>

  <section class="tracker-layout">

    <div class="form-card">
      <h2>Add Transaction</h2>

      <form id="transactionForm">
        <label>Transaction Name</label>
        <input type="text" id="title" placeholder="Example: Food, Salary" required />

        <label>Amount (RM)</label>
        <input type="number" id="amount" placeholder="Example: 20" required />

        <label>Type</label>
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label>Category</label>
        <select id="category" required>
          <option value="Salary">Salary</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Others">Others</option>
        </select>

        <label>Date</label>
        <input type="date" id="date" required />

        <button type="submit" class="btn-primary full">Add Transaction</button>
      </form>

      <button id="clearBtn" class="btn-danger full">Clear All</button>
    </div>

    <div class="history-card">
      <h2>Transaction History</h2>
      <div id="transactionList"></div>
    </div>

  </section>

  <div id="footer"></div>

  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });

    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });

    const form = document.getElementById("transactionForm");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");

    const balanceEl = document.getElementById("balance");
    const incomeEl = document.getElementById("income");
    const expenseEl = document.getElementById("expense");
    const transactionList = document.getElementById("transactionList");
    const clearBtn = document.getElementById("clearBtn");

    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

    dateInput.valueAsDate = new Date();

    function saveData() {
      localStorage.setItem("transactions", JSON.stringify(transactions));
    }

    function formatMoney(amount) {
      return "RM " + Number(amount).toFixed(2);
    }

    function addTransaction(event) {
      event.preventDefault();

      const transaction = {
        id: Date.now(),
        title: titleInput.value,
        amount: Number(amountInput.value),
        type: typeInput.value,
        category: categoryInput.value,
        date: dateInput.value
      };

      transactions.push(transaction);
      saveData();

      form.reset();
      dateInput.valueAsDate = new Date();

      displayTransactions();
      updateSummary();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(item => item.id !== id);
      saveData();
      displayTransactions();
      updateSummary();
    }

    function displayTransactions() {
      transactionList.innerHTML = "";

      if (transactions.length === 0) {
        transactionList.innerHTML = `<p class="empty">No transaction yet 🌷</p>`;
        return;
      }

      transactions.forEach(item => {
        const div = document.createElement("div");
        div.className = "transaction-item";

        const sign = item.type === "income" ? "+" : "-";
        const amountClass = item.type === "income" ? "green" : "red";

        div.innerHTML = `
          <div>
            <h3>${item.title}</h3>
            <p>${item.category} • ${item.date}</p>
          </div>

          <div class="transaction-right">
            <h3 class="${amountClass}">
              ${sign} ${formatMoney(item.amount)}
            </h3>
            <button onclick="deleteTransaction(${item.id})">Delete</button>
          </div>
        `;

        transactionList.appendChild(div);
      });
    }

    function updateSummary() {
      const income = transactions
        .filter(item => item.type === "income")
        .reduce((total, item) => total + item.amount, 0);

      const expense = transactions
        .filter(item => item.type === "expense")
        .reduce((total, item) => total + item.amount, 0);

      const balance = income - expense;

      incomeEl.textContent = formatMoney(income);
      expenseEl.textContent = formatMoney(expense);
      balanceEl.textContent = formatMoney(balance);
    }

    clearBtn.addEventListener("click", function () {
      if (confirm("Are you sure you want to clear all transactions?")) {
        transactions = [];
        saveData();
        displayTransactions();
        updateSummary();
      }
    });

    form.addEventListener("submit", addTransaction);

    displayTransactions();
    updateSummary();
  </script>

</body>
</html>
