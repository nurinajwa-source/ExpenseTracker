<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ExpenseTracker | Fund</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="navbar"></div>

  <section class="page-header">
    <p class="badge">Saving Box</p>
    <h1>My Money Boxes</h1>
    <p>Create many saving boxes and track each goal progress.</p>
  </section>

  <section class="money-box-section">

    <div class="form-card">
      <h2>Create New Money Box</h2>

      <form id="boxForm">
        <label>Box Name</label>
        <input type="text" id="boxName" placeholder="Example: New Laptop" required />

        <label>Target Amount (RM)</label>
        <input type="number" id="targetAmount" placeholder="Example: 2000" min="1" step="0.01" required />

        <button type="submit" class="btn-primary full">Create Money Box</button>
      </form>
    </div>

    <div class="form-card">
      <h2>Add Saving</h2>

      <form id="savingForm">
        <label>Choose Money Box</label>
        <select id="boxSelect" required></select>

        <label>Saving Amount (RM)</label>
        <input type="number" id="savingAmount" placeholder="Example: 50" min="1" step="0.01" required />

        <button type="submit" class="btn-primary full">Add Money</button>
      </form>
    </div>

  </section>

  <section class="money-box-list-section">
    <h2>My Saving Boxes 👛</h2>
    <div id="moneyBoxList" class="money-box-list"></div>
  </section>

  <div id="footer"></div>

  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => document.getElementById("navbar").innerHTML = data);

    fetch("footer.html")
      .then(response => response.text())
      .then(data => document.getElementById("footer").innerHTML = data);

    const boxForm = document.getElementById("boxForm");
    const savingForm = document.getElementById("savingForm");

    const boxNameInput = document.getElementById("boxName");
    const targetAmountInput = document.getElementById("targetAmount");
    const boxSelect = document.getElementById("boxSelect");
    const savingAmountInput = document.getElementById("savingAmount");
    const moneyBoxList = document.getElementById("moneyBoxList");

    let moneyBoxes = JSON.parse(localStorage.getItem("moneyBoxes")) || [];

    function saveMoneyBoxes() {
      localStorage.setItem("moneyBoxes", JSON.stringify(moneyBoxes));
    }

    function formatMoney(amount) {
      return "RM " + Number(amount).toFixed(2);
    }

    function renderBoxOptions() {
      boxSelect.innerHTML = "";

      if (moneyBoxes.length === 0) {
        boxSelect.innerHTML = `<option value="">No money box yet</option>`;
        return;
      }

      moneyBoxes.forEach(box => {
        const option = document.createElement("option");
        option.value = box.id;
        option.textContent = box.name;
        boxSelect.appendChild(option);
      });
    }

    function renderMoneyBoxes() {
      moneyBoxList.innerHTML = "";

      if (moneyBoxes.length === 0) {
        moneyBoxList.innerHTML = `<p class="empty">No money box created yet 🌷</p>`;
        renderBoxOptions();
        return;
      }

      moneyBoxes.forEach(box => {
        let percent = 0;

        if (box.targetAmount > 0) {
          percent = (box.savedAmount / box.targetAmount) * 100;
        }

        if (percent > 100) {
          percent = 100;
        }

        const degree = (percent / 100) * 360;

        const card = document.createElement("div");
        card.className = "money-box-card";

        card.innerHTML = `
          <div class="money-box-icon">👛</div>

          <h2>${box.name}</h2>

          <div class="progress-circle" style="background: conic-gradient(#ff9ecb ${degree}deg, #ffe1ee ${degree}deg);">
            <div>
              <h3>${Math.round(percent)}%</h3>
              <p>Saved</p>
            </div>
          </div>

          <h1>${formatMoney(box.savedAmount)}</h1>
          <p>Target: ${formatMoney(box.targetAmount)}</p>

          <div class="progress-bar">
            <div style="width: ${percent}%"></div>
          </div>

          <button class="btn-danger full" onclick="deleteMoneyBox(${box.id})">Delete Box</button>
        `;

        moneyBoxList.appendChild(card);
      });

      renderBoxOptions();
    }

    function deleteMoneyBox(id) {
      if (confirm("Are you sure you want to delete this money box?")) {
        moneyBoxes = moneyBoxes.filter(box => box.id !== id);
        saveMoneyBoxes();
        renderMoneyBoxes();
      }
    }

    boxForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const newBox = {
        id: Date.now(),
        name: boxNameInput.value.trim(),
        targetAmount: Number(targetAmountInput.value),
        savedAmount: 0
      };

      moneyBoxes.push(newBox);
      saveMoneyBoxes();

      boxForm.reset();
      renderMoneyBoxes();
    });

    savingForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const selectedBoxId = Number(boxSelect.value);
      const savingAmount = Number(savingAmountInput.value);

      const selectedBox = moneyBoxes.find(box => box.id === selectedBoxId);

      if (!selectedBox) {
        alert("Please create a money box first.");
        return;
      }

      selectedBox.savedAmount += savingAmount;

      saveMoneyBoxes();
      savingForm.reset();
      renderMoneyBoxes();
    });

    renderMoneyBoxes();
  </script>

</body>
</html>
